
name: ZeeMan Docker Publish

on:
  workflow_run:
    workflows:
      - ZeeMan Continuous Integration
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Docker Images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Verified Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/brahmashnudev-chatterjee/zeeman-backend:latest
            ghcr.io/brahmashnudev-chatterjee/zeeman-backend:${{ github.event.workflow_run.head_sha }}

      - name: Build and Publish Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/brahmashnudev-chatterjee/zeeman-frontend:latest
            ghcr.io/brahmashnudev-chatterjee/zeeman-frontend:${{ github.event.workflow_run.head_sha }}