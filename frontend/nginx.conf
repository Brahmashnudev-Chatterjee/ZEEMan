server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /login { try_files /login.html =404; }
  location = /register { try_files /login.html =404; }
  location ~ ^/(forgot-password|reset-password|verify-email|onboarding)$ { try_files /login.html =404; }
  location ~ ^/admin/(dashboard|projects|projects/[0-9]+|kanban|calendar)$ { try_files /admin/dashboard.html =404; }
  location ~ ^/user/(dashboard|projects|projects/[0-9]+|my-tasks|tasks/[0-9]+|kanban|calendar)$ { try_files /user/dashboard.html =404; }
  location ~ ^/(features|how-it-works|about|contact|privacy|terms|404)$ { try_files /index.html =404; }
  location / { try_files $uri $uri/ /index.html; }
}
